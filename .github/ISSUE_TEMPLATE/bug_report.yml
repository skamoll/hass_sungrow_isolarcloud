name: Bug Report
description: Report a bug or unexpected behavior in hass_sungrow_isolarcloud
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug and what you expected to happen.
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant & Integration Version
      placeholder: "e.g. Home Assistant 2026.11.1, hass_sungrow_isolarcloud 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: gateway
    attributes:
      label: Regional Gateway
      options:
        - auto
        - eu
        - com
        - au
        - hk
        - cn
        - in
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted Diagnostics (Optional)
      description: Download diagnostics from Settings → Devices & Services → Sungrow iSolarCloud → ⋮ → Download diagnostics. Ensure credentials and personal identifiers remain redacted.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Please redact any email addresses, passwords, tokens, plant IDs, or serial numbers.
      render: text
