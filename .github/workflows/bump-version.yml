name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer part to bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump version in pyproject.toml and manifest.json, commit, and tag
        run: |
          NEW_VER=$(python3 - << 'EOF'
          import json
          import re
          from pathlib import Path

          manifest_path = Path("custom_components/hass_sungrow_isolarcloud/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          major, minor, patch = map(int, manifest["version"].split("."))
          bump = "${{ inputs.bump }}"
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1
          new_ver = f"{major}.{minor}.{patch}"

          manifest["version"] = new_ver
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          pyproject.write_text(
              re.sub(r'^version\s*=\s*"\d+\.\d+\.\d+"', f'version = "{new_ver}"', text, count=1, flags=re.MULTILINE),
              encoding="utf-8",
          )
          print(new_ver)
          EOF
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/hass_sungrow_isolarcloud/manifest.json pyproject.toml
          git commit -m "chore(release): v${NEW_VER}"
          git tag "v${NEW_VER}"
          git push origin main "v${NEW_VER}"
