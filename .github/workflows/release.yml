name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify tag matches manifest.json and pyproject.toml
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          MANIFEST_VER=$(python -c "import json; print(json.load(open('custom_components/hass_sungrow_isolarcloud/manifest.json'))['version'])")
          PKG_VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VER" != "$MANIFEST_VER" ] || [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "Version mismatch: tag=$TAG_VER manifest=$MANIFEST_VER pyproject=$PKG_VER"
            exit 1
          fi

      - name: Lint and structural tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          ruff check .
          ruff format --check .
          pytest -v tests/test_integration_structure.py

      - name: Package HACS zip
        run: |
          cd custom_components/hass_sungrow_isolarcloud
          zip -r ../../hass_sungrow_isolarcloud.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: hass_sungrow_isolarcloud.zip
